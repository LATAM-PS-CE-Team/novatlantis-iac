# ==============================================================================
# REPÚBLICA DIGITAL DE NOVATLANTIS — ESTEIRA GITOPS DE VALIDAÇÃO (TERRAFORM PLAN)
# Repositório: LATAM-PS-CE-Team/novatlantis-iac
# Acionamento:
#   - PR contra 'dev'  (no projeto novatlantis) -> planeja environments/dev  (_TF_ENV=dev)
#   - PR contra 'main' (no projeto novatlantis) -> planeja environments/prod (_TF_ENV=prod)
# ==============================================================================

substitutions:
  _TF_ENV: 'dev'

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1. Verifica formatação padronizada em todos os arquivos .tf
  - id: 'terraform-fmt-check'
    name: 'hashicorp/terraform:1.8'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "[GITOPS-PR] Verificando formatação do código Terraform (terraform fmt)..."
        terraform fmt -check -recursive || terraform fmt -recursive

  # 2. Valida e gera o Plano de Execução do Ambiente Alvo (environments/${_TF_ENV})
  - id: 'terraform-plan'
    name: 'hashicorp/terraform:1.8'
    entrypoint: 'sh'
    waitFor: ['terraform-fmt-check']
    args:
      - '-c'
      - |
        set -e
        echo "=================================================================="
        echo "[GITOPS-PR] Executando 'terraform plan' para AMBIENTE: ${_TF_ENV} (environments/${_TF_ENV})"
        echo "=================================================================="
        cd "environments/${_TF_ENV}"
        terraform init -input=false
        terraform validate
        terraform plan -input=false -no-color
